name: Bucla Catre Client

# Verifica ZILNIC daca vreun remediu marcat "rezolvat" a fost confirmat
# statistic (imbunatatire reala, nu doar declarata) si, doar in acel caz,
# trimite un mesaj scurt catre clientii care s-au plans exact de acea tema
# inainte de remediu. Nu trimite niciodata daca rezultatul e neconcludent
# sau nu arata imbunatatire.
#
# Ruleaza zilnic (nu saptamanal) ca sa nu adauge intarziere in plus peste
# cele 7 zile minime de observare deja impuse in cod (lib/theme-resolution.ts)
# -- fara asta, un remediu care trece pragul de 7 zile marti asteapta inutil
# pana lunea urmatoare.

on:
  schedule:
    # Zilnic la 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  trigger-client-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Declanseaza bucla catre client
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "https://scanvogue.ro/api/client-loop" \
            -H "x-report-secret: ${CLIENT_LOOP_SECRET}")
          echo "Status HTTP: $STATUS"
          echo "Raspuns:"
          cat /tmp/response.json
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Bucla catre client a esuat (status $STATUS)."
            exit 1
          fi
        env:
          CLIENT_LOOP_SECRET: ${{ secrets.CLIENT_LOOP_SECRET }}
